# uMTP-Responder configuration for Kali Cyberdeck Edition on M5Stack CardputerZero
# Served over FunctionFS (/dev/ffs-mtp) by `cz-flipper-gadget mtp` / `cz-usb-gadget mtp`.

loop_on_disconnect 1

storage "/home/kali" "Kali Home" "rw"
storage "/home/kali/isos" "Boot ISOs & Loot" "rw"
storage "/home/kali/payloads" "BadUSB Payloads" "rw"

manufacturer "Kali Cyberdeck x M5Stack"
product "CardputerZero Kali Deck"
serial "CZKALI0001"
firmware_version "2.0"
interface "MTP"

usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1

usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200
