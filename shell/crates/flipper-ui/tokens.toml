# Design tokens for Kali Linux x Flipper One UI on M5Stack CardputerZero (320x170 RGB565).
#
# Single source of truth. build.rs generates the Rust and Slint theme from this
# file; nothing else may contain a colour literal or a layout constant.
#
# Palette matched directly to `cz_ui.h` (Kali Dark) and bottom softkeys aligned
# to physical keys '4', '5', '6', '7', '8' at X centers 48, 104, 160, 216, 272.

[meta]
panel_width = 320
panel_height = 170

[color]
# Default theme: Kali Dark on pure Flipper One UI elements (`[palette.og_flipper]`
# and `[palette.flipper_mono]` below provide live-switchable OG Flipper & Mono options).
white         = "#080c16"   # canvas ground, modal/card base
black         = "#ebf3ff"   # primary text, crisp glyphs, active highlights

divider       = "#22385c"   # rules, inactive frames
disabled_bg   = "#0f1626"   # subtle recessed ground
disabled_fg   = "#526888"   # muted disabled ink
status_dim    = "#8098b9"   # secondary/status labels
card_stroke   = "#22385c"   # unselected interface card outline
pill          = "#14223a"   # card top-right backdrop
chevron_bar   = "#2c84f5"   # drill-in bar
rule_light    = "#1b2e4d"   # modal section rule
rule_faint    = "#14223a"   # subtle row divider inside modals
chip_fill     = "#14223a"   # settings value chip ground
pick_rule     = "#22385c"   # dropdown option divider
app_bar       = "#0c1c3a"   # hosted app title bar
chevron_flash = "#38bcff"   # < > arrow tap flash
popup_edge    = "#2c84f5"   # popup accent edge
keycap_dim    = "#8098b9"   # keyboard language-switcher & secondary labels
sw_tab        = "#2c84f5"   # app switcher background card stroke
sw_tab_deep   = "#22385c"   # deepest card stroke
sw_bar_deep   = "#0f1626"   # off-deck card header bar
dialog_body   = "#8098b9"   # discard-modal secondary line
field_label   = "#38bcff"   # Idle screen field labels (Temperature, Hostname, IPv4)

# Pure Flipper inverted status bar tokens.
bar_bg        = "#0c1c3a"   # top status bar ground
bar_fg        = "#ebf3ff"   # status bar icons & text
header_bg     = "#0c1c3a"   # boot menu & popup header band
bar_bg_light  = "#14223a"   # alternate bar ground
bar_fg_light  = "#ebf3ff"

# Modal scrim.
overlay       = "#050811"

# Unified Flipper selector, soft-tab, press-invert & accent tokens.
sel_bg        = "#122648"   # unpressed SelectorFrame body fill
sel_edge      = "#38bcff"   # SelectorFrame 45-deg stair border & 1px drop shadow
soft_bg       = "#0d172a"   # unpressed SoftButton open-bottom tab fill
soft_edge     = "#2c84f5"   # unpressed SoftButton 45-deg stair border
press_bg      = "#2c84f5"   # pressed row & SoftButton inverted fill
press_fg      = "#ffffff"   # pressed row & SoftButton inverted ink
accent        = "#38bcff"   # active status text, breadcrumbs, spinners & focus stroke
status_low    = "#f84e5c"   # critical <=15% battery warning in StatusBar

# Legacy aliases retained for downstream compatibility.
kali_panel    = "#0f1626"
kali_sel_bg   = "#122648"
kali_tab_act  = "#2c84f5"
kali_btn_bg   = "#0d172a"
kali_cyan     = "#38bcff"
kali_green    = "#26da84"
kali_yellow   = "#fac430"
kali_red      = "#f84e5c"
kali_exit_bg  = "#401824"
kali_exit_fg  = "#ffb4bc"
badge_fg      = "#ffffff"

