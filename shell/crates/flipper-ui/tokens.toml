# CardputerZero physical softkey alignment (`cz_ui.h` `CZ_SOFTKEY_X = {48, 104, 160, 216, 272}`):
#   Slot i starts at `soft_bar_x + i * (button_w + button_gap)` = `22 + i * 56`,
#   placing button centers at `22 + 26 + i * 56` = `48, 104, 160, 216, 272`!
