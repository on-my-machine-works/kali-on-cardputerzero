name: Image Release

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Custom release tag (empty = vYYYY.MM.DD, schedule uses weekly-YYYY.MM.DD)'
        required: false
        default: ''
        type: string
      release_summary:
        description: 'Optional release changelog line'
        required: false
        default: ''
        type: string
      runner:
        description: 'Runner image'
        required: false
        default: 'ubuntu-24.04-arm'
        type: choice
        options:
          - ubuntu-24.04-arm
          - ubuntu-24.04
      m5_update_mode:
        description: 'M5 upstream resolution mode'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - locked
      keep_rolling_releases:
        description: 'Recent rolling (weekly-* and dated vYYYY.MM.DD) releases to retain (0 = keep all)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

concurrency:
  group: weekly-kali-cardputerzero-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 150
    env:
      M5_UPDATE_MODE: ${{ inputs.m5_update_mode || 'auto' }}
      KEEP_ROLLING_RELEASES: ${{ inputs.keep_rolling_releases || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare runner disk space
        run: |
          avail_gb=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          if (( avail_gb < 28 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          fi
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          pkgs=(
            parted dosfstools e2fsprogs btrfs-progs util-linux rsync xz-utils zstd binutils
            dpkg curl git gnupg kmod ca-certificates device-tree-compiler python3
            mmdebstrap debootstrap zerofree build-essential pkg-config
            libudev-dev libdrm-dev libgbm-dev libwayland-dev libxkbcommon-dev
            libfontconfig1-dev libpulse-dev libmp3lame-dev libogg-dev libvorbis-dev
          )
          if [[ "$(uname -m)" != "aarch64" ]]; then
            pkgs+=(qemu-user-static binfmt-support arch-test gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu)
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${pkgs[@]}"
          sudo modprobe loop || true
          if [[ "$(uname -m)" != "aarch64" ]]; then
            sudo systemctl restart systemd-binfmt || sudo update-binfmts --enable qemu-aarch64 || true
            arch-test arm64
          fi

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add aarch64 Rust target when cross-compiling
        if: runner.arch != 'ARM64'
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Resolve release tag & monotonic build number
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_TAG: ${{ inputs.release_tag || '' }}
        run: |
          date_slug="$(date -u +%Y.%m.%d)"
          if [[ -n "${CUSTOM_TAG}" ]]; then
            base_tag="${CUSTOM_TAG}"
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            base_tag="weekly-${date_slug}"
          else
            base_tag="v${date_slug}"
          fi
          tag="$base_tag"
          suffix=2
          while gh release view "$tag" >/dev/null 2>&1; do
            tag="${base_tag}-${suffix}"
            suffix=$((suffix + 1))
          done
          build_num="$(date -u +%s)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "date_slug=${date_slug}" >> "$GITHUB_OUTPUT"
          echo "build_num=${build_num}" >> "$GITHUB_OUTPUT"

      - name: Verify UI token guardrails, Rust workspace tests & Cortex-A53 shell build
        run: |
          sh shell/ci/no-raw-colours.sh
          CARGO_PROFILE_TEST_DEBUG=0 cargo test --manifest-path shell/Cargo.toml --workspace
          CARGO_PROFILE_TEST_DEBUG=0 cargo test --manifest-path shell/Cargo.toml -p flipper-ui --features remote --test remote
          ./scripts/build-cz-shell.sh
          rm -rf shell/target

      - name: Build, verify, finalize and compress image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CZ_VERSION: ${{ steps.meta.outputs.tag }}
          CZ_BUILD_NUM: ${{ steps.meta.outputs.build_num }}
        run: |
          sudo -E ./build-kali-cardputerzero.sh fetch rootfs image
          sudo rm -rf work/rootfs
          sudo -E ./build-kali-cardputerzero.sh kernel drivers packages apps launcher boot configs tweaks verify finalize compress
          sudo chown -R "$(id -u):$(id -g)" output work cache upstream.lock.json
          ls -lh output/

      - name: Update upstream lockfile
        id: lockfile
        run: |
          target_sha="${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${M5_UPDATE_MODE}" == "auto" ]] && ! git diff --quiet -- upstream.lock.json; then
            git config user.name "Lwrless"
            git config user.email "happy.lwr@gmail.com"
            git add upstream.lock.json
            git commit -m "🔒 chore(deps): update verified upstream lockfile [skip ci]"
            if git pull --rebase origin main && git push origin HEAD:main; then
              target_sha="$(git rev-parse HEAD)"
            else
              git reset --hard "${GITHUB_SHA}"
            fi
          fi
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          DATE_SLUG: ${{ steps.meta.outputs.date_slug }}
          BUILD_NUM: ${{ steps.meta.outputs.build_num }}
          RELEASE_SUMMARY: ${{ inputs.release_summary || '' }}
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
        run: |
          tag="${RELEASE_TAG}"
          date_slug="${DATE_SLUG}"

          if [[ "$tag" == weekly-* ]]; then
            rel_title="Kali Cyberdeck CardputerZero (${date_slug})"
          else
            rel_title="Kali Cyberdeck CardputerZero ${tag}"
          fi

          short_sha="$(printf '%.7s' "${{ steps.lockfile.outputs.target_sha }}")"
          OTA_VERSION="$tag" OTA_BUILD_NUM="$BUILD_NUM" OTA_COMMIT="$short_sha" OTA_NOTES="${RELEASE_SUMMARY}" ./scripts/build-ota-bundle.sh
          ota_archive="output/ota/kali-cz-ota-${tag}-arm64.tar.xz"
          ota_sha="$(awk '{print $1}' "${ota_archive}.sha256")"
          ota_size="$(du -h "$ota_archive" | awk '{print $1}')"

          kver="$(python3 -c 'import json; print(json.load(open("upstream.lock.json"))["kernel"]["kver"])')"
          xz_sha="$(awk '{print $1}' output/kali-cardputerzero-arm64.img.xz.sha256)"
          raw_sha="$(awk '/kali-cardputerzero-arm64\.img$/{print $1}' output/kali-cardputerzero-arm64.img.sha256)"
          xz_size="$(du -h output/kali-cardputerzero-arm64.img.xz | awk '{print $1}')"

          {
            echo "## Kali Linux Cyberdeck Edition (\`arm64\`) for M5Stack CardputerZero (\`${tag}\`)"
            echo ""
            echo "Kali Rolling (\`arm64\`) microSD image (\`ext4\`) and signed on-device OTA bundle for M5Stack CardputerZero (\`v5\` / CM0) with Linux \`${kver}\`, native \`320x170\` Kali Cyberdeck Shell (\`czctl\`), PIN-protected \`:8899\` Web KVM, Hostile-Network Stealth Mode (\`cz-stealth\`), signed OTA updater (\`cz-ota\`), 12 handheld apps, composite USB-C OTG Arsenal, and full M5Stack hardware & \`APPLaunch\` support."
            if [[ -n "${RELEASE_SUMMARY}" ]]; then
              echo ""
              summary_expanded="${RELEASE_SUMMARY//\\n/$'\n'}"
              if [[ "$summary_expanded" == "#"* || "$summary_expanded" == "- "* ]]; then
                printf '%s\n' "$summary_expanded"
              else
                echo "### Changes"
                echo "- ${summary_expanded}"
              fi
            fi
            echo ""
            echo "### Checksums (\`SHA-256\`)"
            echo "| File | Size | SHA-256 |"
            echo "| :--- | :---: | :--- |"
            echo "| \`kali-cardputerzero-arm64.img.xz\` *(full microSD image)* | \`${xz_size}\` | \`${xz_sha}\` |"
            echo "| \`kali-cz-ota-${tag}-arm64.tar.xz\` *(signed OTA bundle)* | \`${ota_size}\` | \`${ota_sha}\` |"
            echo "| \`kali-cardputerzero-arm64.img\` *(uncompressed)* | \`7.0G\` | \`${raw_sha}\` |"
            echo ""
            echo "### Flash MicroSD or Update Over-The-Air"
            echo '```bash'
            echo "# Fresh microSD flash:"
            echo "sha256sum -c kali-cardputerzero-arm64.img.xz.sha256"
            echo "xzcat kali-cardputerzero-arm64.img.xz | sudo dd of=/dev/sdX bs=4M status=progress conv=fsync"
            echo ""
            echo "# On-device OTA update (or Menu -> Settings -> Update Kali CZ):"
            echo "sudo cz-ota update"
            echo '```'
            echo "*(Default login: \`kali\` / \`kali\`; Web KVM on \`:8899\` is off by default and PIN-protected when enabled in \`Network -> Web KVM (:8899)\`; see \`README.md\` for Stealth Mode, OTA, USB OTG Arsenal, HDMI desktop, and external Wi-Fi usage.)*"
          } > /tmp/release-notes.md

          if [[ -s work/m5-warnings.md ]]; then
            {
              echo ""
              echo "### Upstream Component Notes"
              cat work/m5-warnings.md
            } >> /tmp/release-notes.md
          fi

          ota_assets=(
            "$ota_archive"
            "${ota_archive}.sha256"
            "output/ota/ota-manifest.json"
          )
          if [[ -f output/ota/ota-manifest.json.sig ]]; then
            ota_assets+=("output/ota/ota-manifest.json.sig")
          fi

          gh release create "$tag" \
            output/kali-cardputerzero-arm64.img.xz \
            output/kali-cardputerzero-arm64.img.xz.sha256 \
            "${ota_assets[@]}" \
            --target "${{ steps.lockfile.outputs.target_sha }}" \
            --title "${rel_title}" \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Apply release retention policy
        if: env.KEEP_ROLLING_RELEASES != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          keep="${KEEP_ROLLING_RELEASES}"
          if ! [[ "$keep" =~ ^[0-9]+$ ]] || (( keep < 1 )); then
            exit 0
          fi

          mapfile -t old_tags < <(
            gh release list --limit 100 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | test("^(weekly-|v?[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}(-|$))"))] | sort_by(.createdAt) | reverse | .['"$keep"':] | .[].tagName'
          )

          for old in "${old_tags[@]}"; do
            [[ -n "$old" ]] || continue
            gh release delete "$old" --yes --cleanup-tag
          done
